<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>카페24 연동 중...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #1976d2; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #333; margin: 0 0 8px; }
    p { color: #666; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>카페24 연동 처리 중...</h2>
    <p>잠시 후 창이 닫힙니다.</p>
  </div>
  <script>
    // URL에서 code와 state 파라미터 추출
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (window.opener) {
      if (code) {
        // 부모 창으로 인증 코드 전달
        window.opener.postMessage({ type: 'CAFE24_AUTH_CODE', code }, window.location.origin);
      } else if (error) {
        window.opener.postMessage({ type: 'CAFE24_AUTH_ERROR', error }, window.location.origin);
      }
      setTimeout(() => window.close(), 500);
    } else {
      document.querySelector('p').textContent = '창을 직접 닫아주세요.';
    }
  </script>
</body>
</html>
