<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CRM Application"
    />
    <!-- 보안 헤더 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:5001 https://*.up.railway.app https://*.supabase.co wss://*.supabase.co https://api.openai.com https://api.telegram.org; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>CRM App</title>
    <script>
      // env.js 로드 전에 기본 객체 초기화
      window._env_ = window._env_ || {};
    </script>
    <script src="%PUBLIC_URL%/env.js?v=20241229"></script>
    <script>
      // env.js 로드 후 빌드 시점 환경 변수 병합
      // 빌드 시점 값이 실제로 설정되어 있는지 확인 (빈 문자열이나 '%...%' 패턴이 아닌 경우)
      const getBuildTimeValue = (buildValue, envKey) => {
        // 빌드 시점 값이 실제 값인지 확인 (환경 변수가 치환되지 않은 경우 '%...%' 패턴)
        if (buildValue && buildValue !== `%${envKey}%` && buildValue.trim() !== '') {
          return buildValue;
        }
        // env.js에서 로드된 값 사용
        return window._env_ && window._env_[envKey] ? window._env_[envKey] : buildValue;
      };
      
      window._env_ = {
        ...window._env_,
        REACT_APP_OPENAI_API_ENDPOINT: getBuildTimeValue('%REACT_APP_OPENAI_API_ENDPOINT%', 'REACT_APP_OPENAI_API_ENDPOINT'),
        REACT_APP_OPENAI_MODEL: getBuildTimeValue('%REACT_APP_OPENAI_MODEL%', 'REACT_APP_OPENAI_MODEL'),
        REACT_APP_OPENAI_API_KEY: getBuildTimeValue('%REACT_APP_OPENAI_API_KEY%', 'REACT_APP_OPENAI_API_KEY'),
        REACT_APP_SUPABASE_URL: getBuildTimeValue('%REACT_APP_SUPABASE_URL%', 'REACT_APP_SUPABASE_URL'),
        REACT_APP_SUPABASE_ANON_KEY: getBuildTimeValue('%REACT_APP_SUPABASE_ANON_KEY%', 'REACT_APP_SUPABASE_ANON_KEY'),
        REACT_APP_CLOUDMARSSIVE_API_KEY: getBuildTimeValue('%REACT_APP_CLOUDMARSSIVE_API_KEY%', 'REACT_APP_CLOUDMARSSIVE_API_KEY'),
        REACT_APP_GOOGLE_CLIENT_ID: getBuildTimeValue('%REACT_APP_GOOGLE_CLIENT_ID%', 'REACT_APP_GOOGLE_CLIENT_ID'),
        REACT_APP_GOOGLE_DRIVE_ROOT_FOLDER_ID: getBuildTimeValue('%REACT_APP_GOOGLE_DRIVE_ROOT_FOLDER_ID%', 'REACT_APP_GOOGLE_DRIVE_ROOT_FOLDER_ID'),
        REACT_APP_GOOGLE_DRIVE_SUBFOLDER: getBuildTimeValue('%REACT_APP_GOOGLE_DRIVE_SUBFOLDER%', 'REACT_APP_GOOGLE_DRIVE_SUBFOLDER'),
        REACT_APP_TELEGRAM_BOT_TOKEN: getBuildTimeValue('%REACT_APP_TELEGRAM_BOT_TOKEN%', 'REACT_APP_TELEGRAM_BOT_TOKEN'),
        REACT_APP_TELEGRAM_CHAT_ID: getBuildTimeValue('%REACT_APP_TELEGRAM_CHAT_ID%', 'REACT_APP_TELEGRAM_CHAT_ID'),
        REACT_APP_BASE_URL: getBuildTimeValue('%REACT_APP_BASE_URL%', 'REACT_APP_BASE_URL')
      };
      
      // 디버깅: 환경 변수 로드 확인
      console.log('[Env Load] 환경 변수 로드 완료:', {
        googleClientId: window._env_.REACT_APP_GOOGLE_CLIENT_ID,
        allKeys: Object.keys(window._env_),
        envJsLoaded: !!window._env_,
        fullEnv: window._env_
      });
      
      // 클라이언트 ID 검증 및 강제 수정
      const expectedClientId = '858601328382-kpeaafkvvqaepgii0e79riruh8c642ei.apps.googleusercontent.com';
      const oldClientId = '291524102200-u2ogome9r6r99klqh6foslt26nj5ndmg.apps.googleusercontent.com';
      
      if (window._env_.REACT_APP_GOOGLE_CLIENT_ID === oldClientId) {
        console.error('⚠️ 이전 클라이언트 ID가 감지되었습니다. 강제로 수정합니다.');
        window._env_.REACT_APP_GOOGLE_CLIENT_ID = expectedClientId;
        console.log('✅ 클라이언트 ID가 강제로 업데이트되었습니다.');
      } else if (window._env_.REACT_APP_GOOGLE_CLIENT_ID === expectedClientId) {
        console.log('✅ 올바른 클라이언트 ID가 로드되었습니다.');
      } else if (!window._env_.REACT_APP_GOOGLE_CLIENT_ID) {
        console.warn('⚠️ 클라이언트 ID가 없습니다. 기본값으로 설정합니다.');
        window._env_.REACT_APP_GOOGLE_CLIENT_ID = expectedClientId;
      } else {
        console.warn('⚠️ 예상하지 못한 클라이언트 ID:', window._env_.REACT_APP_GOOGLE_CLIENT_ID);
        // 예상하지 못한 값이어도 올바른 값으로 강제 설정
        window._env_.REACT_APP_GOOGLE_CLIENT_ID = expectedClientId;
        console.log('✅ 클라이언트 ID가 올바른 값으로 강제 설정되었습니다.');
      }
    </script>
    <!-- Google OAuth 및 API 클라이언트 라이브러리 -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
