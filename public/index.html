<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CRM Application"
    />
    <!-- 보안 헤더 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.anthropic.com https://api.openai.com https://api.telegram.org; frame-src 'self' https://accounts.google.com; worker-src 'self' blob:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>CRM App</title>
    <script>
      // env.js 로드 전에 기본 객체 초기화
      window._env_ = window._env_ || {};
      console.log('[HTML Init] 환경 변수 객체 초기화');
    </script>
    <script src="%PUBLIC_URL%/env.js" onerror="console.error('[HTML Init] env.js 로드 실패'); window._env_ = window._env_ || {};"></script>
    <script>
      // env.js 로드 후 빌드 시점 환경 변수 병합
      (function() {
        console.log('[HTML Init] env.js 로드 후 환경 변수 확인:', {
          hasEnv: !!window._env_,
          keys: window._env_ ? Object.keys(window._env_) : [],
          hasSupabaseUrl: !!(window._env_ && window._env_.REACT_APP_SUPABASE_URL),
          hasSupabaseKey: !!(window._env_ && window._env_.REACT_APP_SUPABASE_ANON_KEY)
        });
        
        window._env_ = {
          ...window._env_,
          REACT_APP_OPENAI_API_ENDPOINT: '%REACT_APP_OPENAI_API_ENDPOINT%' || (window._env_ && window._env_.REACT_APP_OPENAI_API_ENDPOINT) || '',
          REACT_APP_OPENAI_MODEL: '%REACT_APP_OPENAI_MODEL%' || (window._env_ && window._env_.REACT_APP_OPENAI_MODEL) || 'gpt-4o-mini',
          REACT_APP_OPENAI_API_KEY: '%REACT_APP_OPENAI_API_KEY%' || (window._env_ && window._env_.REACT_APP_OPENAI_API_KEY) || '',
          REACT_APP_SUPABASE_URL: '%REACT_APP_SUPABASE_URL%' || (window._env_ && window._env_.REACT_APP_SUPABASE_URL) || '',
          REACT_APP_SUPABASE_ANON_KEY: '%REACT_APP_SUPABASE_ANON_KEY%' || (window._env_ && window._env_.REACT_APP_SUPABASE_ANON_KEY) || '',
          REACT_APP_CLAUDE_API_KEY: '%REACT_APP_CLAUDE_API_KEY%' || (window._env_ && window._env_.REACT_APP_CLAUDE_API_KEY) || '',
          REACT_APP_CLOUDMARSSIVE_API_KEY: '%REACT_APP_CLOUDMARSSIVE_API_KEY%' || (window._env_ && window._env_.REACT_APP_CLOUDMARSSIVE_API_KEY) || '',
          REACT_APP_GOOGLE_CLIENT_ID: '%REACT_APP_GOOGLE_CLIENT_ID%' || (window._env_ && window._env_.REACT_APP_GOOGLE_CLIENT_ID) || ''
        };
        
        console.log('[HTML Init] 최종 환경 변수:', {
          keys: Object.keys(window._env_),
          hasSupabaseUrl: !!window._env_.REACT_APP_SUPABASE_URL,
          hasSupabaseKey: !!window._env_.REACT_APP_SUPABASE_ANON_KEY,
          supabaseUrl: window._env_.REACT_APP_SUPABASE_URL ? window._env_.REACT_APP_SUPABASE_URL.substring(0, 30) + '...' : '없음'
        });
      })();
    </script>
    <!-- Google OAuth 및 API 클라이언트 라이브러리 -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
