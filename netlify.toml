[build]
  command = "npm install && npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "9"
  REACT_APP_OPENAI_MODEL = "gpt-4o-mini"
  NODE_ENV = "production"
  REACT_APP_BACKEND_URL = "https://crm-production-067b.up.railway.app"
  # scratch/test 파일에 하드코딩된 키 값이 있어 스캔 예외 처리
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_KEY,SUPABASE_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  REACT_APP_OPENAI_MODEL = "gpt-4o-mini" 