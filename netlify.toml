[build]
  command = "CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  REACT_APP_OPENAI_MODEL = "gpt-4o-mini"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  REACT_APP_OPENAI_MODEL = "gpt-4o-mini"
  NODE_ENV = "production" 